name: tsports_nomansho
description: T Sports — No Man Show. Self-serve sports venue management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Fonts & Icons
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.0

  # Animations
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  lottie: ^3.1.2

  # Charts (Admin)
  fl_chart: ^0.69.0

  # QR Code
  qr_flutter: ^4.1.0

  # Images
  cached_network_image: ^3.3.1

  # UI Utils
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/animations/
    - assets/mock/
